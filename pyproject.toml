[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocalvitals"
version = "0.1.0"
description = "Research prototype for swallow-event detection from cervical-auscultation signals"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<4",
  "soundfile>=0.12,<1",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
  "torchaudio>=2.2",
]
api = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "paho-mqtt>=2,<3",
  "requests>=2.31,<3",
]
edge = [
  "sounddevice>=0.4,<1",
]
synthetic = [
  "librosa>=0.10,<1",
  "streamlit>=1.32,<2",
  "matplotlib>=3.8,<4",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.4,<1",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
